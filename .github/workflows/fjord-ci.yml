name: Vérification du site Fjord
on:
  pull_request:
  push:
    branches: [main]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pip install Pillow
      - run: python -m compileall -q app.py private_fjord.py real_slicer.py quote_estimator.py model_preview.py
      - run: python -m unittest discover -s tests -v
      - run: pip install playwright
      - run: python -m playwright install --with-deps chromium
      - run: python tests/verify_auto_print_browser.py
      - run: python tests/verify_measure_circle_browser.py
      - run: python tests/verify_import_browser.py
      - run: python tests/verify_ams_colors_browser.py
      - run: python tests/verify_paint_text_browser.py
      - run: python tests/verify_mobile_paint_zoom_browser.py
      - run: python tests/verify_generator_catalog_browser.py
      - run: python tests/verify_generator_edit_browser.py
      - run: python tests/verify_torsion_spring_browser.py
      - run: python tests/verify_quote_reset_browser.py
      - run: python tests/verify_quote_library_browser.py
      - run: python tests/verify_bulk_import_browser.py
