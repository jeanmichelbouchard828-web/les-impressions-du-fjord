name: Wikimedia Commons licensed-image connectivity diagnostic
on:
  workflow_dispatch:
  push:
    branches: [migration/render-fjord-20261104]
    paths:
      - "tools/check_commons_api.py"
      - ".github/workflows/fjord-wikimedia-api.yml"
jobs:
  Wikimedia:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/check_commons_api.py
