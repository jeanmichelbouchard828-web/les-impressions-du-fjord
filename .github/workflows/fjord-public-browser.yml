name: Fjord public browser audit
on:
  workflow_dispatch:
  push:
    branches:
      - migration/render-fjord-20261104
    paths:
      - "tests/verify_fjord_public_browser.py"
      - ".github/workflows/fjord-public-browser.yml"
jobs:
  storefront-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Chromium for storefront checks
        run: |
          pip install playwright==1.58.0
          python -m playwright install --with-deps chromium
      - name: Verify full public website in Chromium (desktop and mobile)
        env:
          FJORD_TEST_BASE: https://fjord-render-apercu-20261104.onrender.com
        run: python tests/verify_fjord_public_browser.py
      - name: Save browser review captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fjord-browser-review
          path: /tmp/fjord-browser-check/*.png
          retention-days: 3
          if-no-files-found: ignore
