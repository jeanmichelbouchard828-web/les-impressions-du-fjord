name: Render Fjord lightweight smoke
on:
  pull_request:
    paths:
      - "Dockerfile.render-lite"
      - "fjord_preview_guard.py"
      - "app.py"
      - "render.yaml"
      - ".github/workflows/render-lite.yml"
  push:
    branches:
      - migration/render-fjord-20261104
jobs:
  render-lite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build lightweight Render container (no slicers)
        run: docker build --tag fjord-render-lite-ci --file Dockerfile.render-lite .
      - name: Verify JavaScript syntax
        run: |
          node --check static/fjord_sitewide.js
          node --check static/fjord_atelier_enhancements.js
      - name: Run site-wide regression tests in container
        run: |
          docker run --rm -v "$PWD/tests:/app/tests:ro" fjord-render-lite-ci \
            python -m unittest discover -s tests -p 'test_storefront_integrity.py' -v
      - name: Validate core quote, payment-link and X2D safety routines offline
        run: |
          docker run --rm -v "$PWD/tests:/app/tests:ro" fjord-render-lite-ci \
            sh -ec "python -m unittest discover -s tests -p 'test_private_fjord.py' -v && \
                    python -m unittest discover -s tests -p 'test_fjord_printer.py' -v && \
                    python -m unittest discover -s tests -p 'test_quote_estimator.py' -v && \
                    python -m unittest discover -s tests -p 'test_fjord_preview_guard.py' -v"
      - name: Read-only live Render smoke check
        run: |
          python - <<'PY'
          import json
          import urllib.request
          import urllib.error
          base="https://fjord-render-apercu-20261104.onrender.com"
          paths=["/health/ready","/","/galerie","/soumission","/atelier-3d","/robots.txt","/sitemap.xml","/static/fjord_sitewide.css","/gallery/thumb/0"]
          results={}
          for path in paths:
              try:
                  with urllib.request.urlopen(urllib.request.Request(base+path,headers={"User-Agent":"Fjord-ReadOnly-Smoke/1.0"}),timeout=25) as response:
                      status=response.status
                      body=response.read(4000) if path=="/health/ready" else b""
              except urllib.error.HTTPError as error:
                  status=error.code
                  body=b""
              results[path]=status
              if path=="/health/ready" and status==200:
                  readiness=json.loads(body)
                  mode=readiness.get("mode")
                  temporary=readiness.get("temporary_preview_database")
                  print("Readiness:",{"mode":mode,"temporary_preview_database":temporary,"database_ok":readiness.get("ok")})
                  if mode=="production" and temporary:
                      raise SystemExit("Unsafe: production requests use expiring temporary preview database")
              print(path,status)
          assert results["/health/ready"]==200,"Database readiness check failed"
          for required in ["/","/galerie","/soumission","/atelier-3d","/robots.txt","/static/fjord_sitewide.css"]:
              assert results[required]==200,f"Public route broken: {required}"
          assert results["/gallery/thumb/0"]==404,"Missing gallery thumbnail should return 404"
          assert results["/sitemap.xml"] in (200,503),"Sitemap unexpected status"
          PY
      - name: Reject production Railway database BEFORE startup
        shell: bash
        run: |
          set +e
          docker run --rm -e FJORD_PREVIEW_MODE=1 \
            -e DATABASE_URL=postgresql://tester:dummy@proxy.rlwy.net/railway \
            fjord-render-lite-ci python -c "import app" > startup.log 2>&1
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "FAIL: preview incorrectly booted with Railway database"
            exit 1
          fi
          grep -F "PREVIEW REFUSED: isolated Render PostgreSQL required." startup.log
          echo "PASS: Railway database refused without any database migration"
